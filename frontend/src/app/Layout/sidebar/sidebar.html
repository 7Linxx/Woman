<aside class="sidebar">
  <nav class="sidebar-menu" aria-label="Navegación principal">
    @for (item of menu; track item.path) {
      <a
        class="menu-item"
        [routerLink]="item.path"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
      >
        {{ item.label }}
      </a>
    }
  </nav>
</aside>
